<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e1b4b" />
    <title>오프라인 | MDN 한국어 문서</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, "Segoe UI", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #f8fafc;
        color: #0f172a;
        text-align: center;
        padding: 24px;
      }
      .card {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 40px;
        max-width: 420px;
      }
      h1 { font-size: 22px; margin: 0 0 12px; }
      p { color: #64748b; margin: 0 0 24px; }
      a {
        display: inline-block;
        background: #4f46e5;
        color: #fff;
        text-decoration: none;
        padding: 10px 24px;
        border-radius: 10px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>오프라인 상태입니다</h1>
      <p>인터넷에 연결되어 있지 않아요. 연결 후 다시 시도해 주세요.</p>
      <a href="./">다시 시도</a>
    </div>
  </body>
</html>
